profile_id: retail
name: Retail and e-commerce
version: "1.0.0"
owner: Nexora (educational prototype)
coverage: tested_end_to_end
description: >
  Order-line checks: references, prices and quantities, order-total arithmetic, returns and refunds,
  inventory and duplicate order candidates.
guardrail: >
  Promotions, bundles, refunds and backorders can explain unusual values. Flags are for review only.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    normalize_case: {order_type: upper, currency: upper}
    missing:
      discount_amount: {strategy: constant, value: "0", rationale: "A blank discount means no discount was applied; the line-total check already treats it as zero."}
    duplicates:
      key: [order_id, sku]
      rationale: "One row per order and SKU: an identical row with the same key is a repeated load."
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.0.0", date: "2026-10-18", note: "Initial profile"}
fields:
  order_id: {label: Order ID, type: identifier, required: true, aliases: [order_number, orderid, order_no]}
  order_date: {label: Order date, type: datetime, required: true, aliases: [date, ordered_at, order_time]}
  customer_id: {label: Customer ID, type: identifier, aliases: [customer, cust_id]}
  sku: {label: SKU / product ID, type: identifier, required: true, aliases: [product_id, item_id, product, item]}
  quantity: {label: Quantity, type: number, required: true, aliases: [qty, units]}
  unit_price: {label: Unit price, type: number, required: true, aliases: [price, item_price]}
  discount_amount: {label: Discount amount, type: number, aliases: [discount]}
  order_total: {label: Line total, type: number, aliases: [total, line_total, amount]}
  order_type: {label: Order type, type: category, aliases: [type, transaction_type]}
  return_reason: {label: Return reason, type: text, aliases: [reason, refund_reason]}
  currency: {label: Currency, type: category, aliases: [ccy, currency_code]}
  stock_on_hand: {label: Stock on hand, type: number, aliases: [inventory, on_hand, stock]}
  ship_date: {label: Ship date, type: datetime, aliases: [shipped_at, shipping_date]}
rules:
  - id: RET-001
    name: Key order fields are present
    type: required
    fields: [order_id, order_date, sku, quantity, unit_price]
    severity: High
    explanation: A mandatory order field is empty.
    recommendation: Obtain the value from the order system.
    rationale: Needed to price and ship an order line.
  - id: RET-002
    name: One row per order and SKU
    type: unique
    fields: [order_id, sku]
    severity: High
    explanation: The same SKU appears more than once in the same order.
    recommendation: Check whether the lines should have been merged or the feed duplicated.
    rationale: Duplicate lines double revenue.
  - id: RET-003
    name: Numeric fields are numeric
    type: numeric
    fields: [quantity, unit_price, discount_amount, order_total, stock_on_hand]
    severity: High
    explanation: The value is not a plain number.
    recommendation: Check for currency symbols or text; keep the original.
    rationale: Arithmetic checks need numbers.
  - id: RET-004
    name: Dates are valid
    type: datetime
    fields: [order_date, ship_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: RET-005
    name: Unit price is not negative
    type: range
    fields: [unit_price]
    params: {min: 0}
    category: Invalid
    severity: High
    explanation: A negative unit price is not valid. Refunds should be modelled through the order type, not a negative price.
    recommendation: Check the pricing feed.
    rationale: Logical lower bound. Price 0 is allowed (free items).
  - id: RET-006
    name: Sales have a positive quantity
    type: range
    fields: [quantity]
    params: {min: 1}
    when: [{field: order_type, in: [SALE]}]
    category: Invalid
    severity: High
    explanation: A sale line has a quantity below 1.
    recommendation: Check whether the line is really a return.
    rationale: Sales must move at least one unit.
  - id: RET-007
    name: Line total = quantity x unit price - discount
    type: expression_equals
    params: {target: order_total, expression: "quantity * unit_price - discount_amount", tolerance_abs: 0.01, blank_as_zero: [discount_amount]}
    severity: High
    explanation: The line total does not equal quantity times price minus discount (an empty discount counts as zero).
    recommendation: Check promotions, tax inclusion and rounding. Edit the expression if totals include shipping or tax.
    rationale: Order-total consistency.
  - id: RET-008
    name: Shipped on or after the order date
    type: date_order
    fields: [order_date, ship_date]
    severity: Medium
    explanation: The ship date is earlier than the order date.
    recommendation: Check both dates and time zones.
    rationale: Timeline consistency.
  - id: RET-009
    name: Order type is in the configured list
    type: allowed_values
    fields: [order_type]
    params: {values: [SALE, RETURN, REFUND, EXCHANGE]}
    severity: Medium
    explanation: The order type is not in the configured list.
    recommendation: Map to a known type or extend the list.
    rationale: Return and refund rules depend on the type.
  - id: RET-010
    name: Returns and refunds have a reason
    type: required
    fields: [return_reason]
    when: [{field: order_type, in: [RETURN, REFUND]}]
    severity: Medium
    explanation: A return or refund has no reason recorded.
    recommendation: Add the reason from the return slip or ticket.
    rationale: Return analysis needs reasons.
  - id: RET-011
    name: Stock on hand is not negative
    type: range
    fields: [stock_on_hand]
    params: {min: 0}
    category: Suspicious
    severity: Medium
    explanation: Negative stock can mean a counting error, but backorders and pre-orders can also cause it.
    recommendation: Check inventory movements before correcting.
    rationale: Inventory consistency, with business-context exceptions.
  - id: RET-012
    name: Possible duplicate orders
    type: duplicate_rows
    fields: [customer_id, sku, order_date, quantity, unit_price]
    severity: Medium
    explanation: Several rows share customer, SKU, date, quantity and price. Repeat purchases can be genuine.
    recommendation: Check whether the customer double-clicked or the feed repeated.
    rationale: Duplicate orders are a common cause of overstated sales.
  - id: RET-013
    name: Currency is a three-letter uppercase code
    type: regex
    fields: [currency]
    params: {pattern: '[A-Z]{3}'}
    severity: Low
    explanation: The currency does not look like a three-letter code.
    recommendation: Replace with a valid code.
    rationale: Format check only.
  - id: RET-014
    name: Quantity screening (statistical)
    type: statistical_anomaly
    fields: [quantity]
    params: {method: iqr, k: 3.0, min_samples: 10}
    severity: Low
    explanation: The quantity is far from typical quantities in this file. Bulk or wholesale orders can be genuine.
    recommendation: Review only.
    rationale: Screening aid, not an error label.
