profile_id: hr
name: Human resources and workforce
version: "1.1.0"
owner: Nexora (educational prototype)
coverage: basic
description: >
  Employee record checks: employee references, effective dates, required fields, department references and payroll-period consistency.
guardrail: >
  Apply strict access controls. This profile has no statistical outlier screening on purpose: do not infer sensitive traits or support employment decisions from anomalies. Basic coverage.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    duplicates: {key: [employee_id, effective_date], rationale: "One record per employee and effective date; identical rows are a duplicated load."}
    normalize_case: {employment_status: upper}
    outliers: {policy: review, rationale: "Unusual pay amounts can be bonuses, back pay or errors; confirm with payroll before changing."}
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.1.0", date: "2026-10-28", note: "Added domain-aware cleaning settings (record key, spellings, units, outlier policy)."}
  - {version: "1.0.0", date: "2026-10-18", note: "Initial basic-coverage profile. Needs domain-expert validation."}
fields:
  employee_id: {label: Employee ID, type: identifier, required: true, aliases: [employeeid, emp_id, staff_id]}
  department_id: {label: Department ID, type: identifier, required: true, aliases: [department, dept_id, dept]}
  employment_status: {label: Employment status, type: category, aliases: [status, emp_status]}
  hire_date: {label: Hire date, type: datetime, required: true, aliases: [date_of_joining, start_date, joined_on]}
  termination_date: {label: Termination date, type: datetime, aliases: [exit_date, left_on]}
  effective_date: {label: Record effective date, type: datetime, aliases: [effective_from, record_date]}
  pay_period_start: {label: Pay period start, type: datetime, aliases: [period_start]}
  pay_period_end: {label: Pay period end, type: datetime, aliases: [period_end]}
  pay_date: {label: Pay date, type: datetime, aliases: [payment_date, paid_on]}
  pay_amount: {label: Pay amount, type: number, aliases: [gross_pay, payroll_amount]}
rules:
  - id: HR-001
    name: Employee, department and hire date are present
    type: required
    fields: [employee_id, department_id, hire_date]
    severity: High
    explanation: A mandatory field is empty.
    recommendation: Obtain the value from the HR system.
    rationale: Mandatory fields.
  - id: HR-002
    name: One record per employee and effective date
    type: unique
    fields: [employee_id, effective_date]
    severity: High
    explanation: The same employee has more than one record for the same effective date.
    recommendation: Check for duplicate history rows.
    rationale: Record integrity.
  - id: HR-003
    name: Dates are valid
    type: datetime
    fields: [hire_date, termination_date, effective_date, pay_period_start, pay_period_end, pay_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: HR-004
    name: Termination is not before hire
    type: date_order
    fields: [hire_date, termination_date]
    severity: High
    explanation: The termination date is earlier than the hire date.
    recommendation: Check both dates.
    rationale: Date consistency.
  - id: HR-005
    name: Pay period ends after it starts
    type: date_order
    fields: [pay_period_start, pay_period_end]
    severity: High
    explanation: The pay period end is earlier than its start.
    recommendation: Check the payroll calendar.
    rationale: Payroll-period consistency.
  - id: HR-006
    name: Pay date is not before the period end
    type: compare
    fields: [pay_date, pay_period_end]
    params: {op: ">=", kind: datetime}
    category: Suspicious
    severity: Low
    explanation: Pay was dated before the period ended. Advance payments exist, so this is a review signal.
    recommendation: Check the payroll run.
    rationale: Payroll-period consistency.
  - id: HR-007
    name: Record is effective on or after hire
    type: compare
    fields: [effective_date, hire_date]
    params: {op: ">=", kind: datetime}
    severity: Medium
    explanation: The record is effective before the person was hired.
    recommendation: Check the effective date.
    rationale: Effective-date consistency.
  - id: HR-008
    name: Employment status is in the configured list
    type: allowed_values
    fields: [employment_status]
    params: {values: [ACTIVE, TERMINATED, LEAVE, SUSPENDED, RETIRED]}
    severity: Medium
    explanation: The status is not in the configured list.
    recommendation: Map to a known status.
    rationale: Status hygiene.
  - id: HR-009
    name: Terminated employees have a termination date
    type: required
    fields: [termination_date]
    when: [{field: employment_status, in: [TERMINATED]}]
    severity: High
    explanation: A terminated employee has no termination date.
    recommendation: Add the date from the HR record.
    rationale: Mandatory field by status.
  - id: HR-010
    name: Pay amounts are numeric
    type: numeric
    fields: [pay_amount]
    severity: High
    explanation: The pay amount is not a plain number.
    recommendation: Check for currency symbols.
    rationale: Numeric checks need numbers.
  - id: HR-011
    name: Pay amount is not negative
    type: range
    fields: [pay_amount]
    params: {min: 0}
    category: Suspicious
    severity: Medium
    explanation: A negative pay amount can be a clawback or correction, or an error.
    recommendation: Check the payroll adjustment records.
    rationale: Context-dependent.
  - id: HR-012
    name: Department exists in the department list (needs reference file)
    type: referential
    fields: [department_id]
    params: {reference_table: departments, reference_column: department_id}
    severity: Medium
    explanation: The department is not in the supplied department list.
    recommendation: Check the department code.
    rationale: Skipped unless a reference file called 'departments' is supplied.
  - id: HR-013
    name: Possible duplicate payroll records
    type: duplicate_rows
    fields: [employee_id, pay_period_start, pay_period_end]
    severity: Medium
    explanation: Several payroll records share employee and pay period. Supplementary payments can be genuine.
    recommendation: Review with payroll.
    rationale: Duplicate payroll records.
