profile_id: education
name: Education
version: "1.1.0"
owner: Nexora (educational prototype)
coverage: basic
description: >
  Enrollment and attendance checks: student/course references, institution-defined grade scales, term consistency and duplicate registrations.
guardrail: >
  Grading scales are institution-specific; edit the lists to your institution's rules. Restrict access to personal student data.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    duplicates: {key: [student_id, course_id, term], rationale: "One enrolment per student, course and term; identical rows are repeated exports."}
    normalize_case: {attendance_status: upper, grade: upper}
    outliers: {policy: review, rationale: "Scores outside the usual spread are often real (top or failing students); check data-entry errors only."}
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.1.0", date: "2026-10-28", note: "Added domain-aware cleaning settings (record key, spellings, units, outlier policy)."}
  - {version: "1.0.0", date: "2026-10-18", note: "Initial basic-coverage profile. Needs domain-expert validation."}
fields:
  student_id: {label: Student ID, type: identifier, required: true, aliases: [studentid, student_no, learner_id]}
  course_id: {label: Course ID, type: identifier, required: true, aliases: [courseid, course_code, course]}
  term: {label: Term, type: text, required: true, aliases: [semester, session, academic_term]}
  enrollment_date: {label: Enrollment date, type: datetime, aliases: [enrolled_on, registration_date]}
  term_start: {label: Term start, type: datetime, aliases: [semester_start, start_date]}
  term_end: {label: Term end, type: datetime, aliases: [semester_end, end_date]}
  grade: {label: Grade, type: category, aliases: [letter_grade, final_grade]}
  score: {label: Score (0-100), type: number, aliases: [marks, percentage, final_score]}
  attendance_date: {label: Attendance date, type: datetime, aliases: [class_date, session_date]}
  attendance_status: {label: Attendance status, type: category, aliases: [attendance, present]}
rules:
  - id: EDU-001
    name: Student, course and term are present
    type: required
    fields: [student_id, course_id, term]
    severity: High
    explanation: A mandatory enrollment field is empty.
    recommendation: Obtain the value from the student information system.
    rationale: Needed to identify a registration.
  - id: EDU-002
    name: One registration per student, course and term
    type: unique
    fields: [student_id, course_id, term]
    severity: High
    explanation: The student is registered more than once for the same course and term.
    recommendation: Check for a double registration or data merge.
    rationale: Duplicate registrations inflate counts.
  - id: EDU-003
    name: Dates are valid
    type: datetime
    fields: [enrollment_date, term_start, term_end, attendance_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: EDU-004
    name: Term ends after it starts
    type: date_order
    fields: [term_start, term_end]
    severity: High
    explanation: The term end date is earlier than its start date.
    recommendation: Check the academic calendar.
    rationale: Term consistency.
  - id: EDU-005
    name: Enrollment is not after term end
    type: compare
    fields: [enrollment_date, term_end]
    params: {op: "<=", kind: datetime}
    severity: Medium
    explanation: The enrollment date is after the term ended. Late back-dated registrations exist but need checking.
    recommendation: Confirm with the registrar.
    rationale: Term consistency.
  - id: EDU-006
    name: Attendance falls inside the term
    type: compare
    fields: [attendance_date, term_start]
    params: {op: ">=", kind: datetime}
    severity: Medium
    explanation: The attendance date is before the term started.
    recommendation: Check the class date.
    rationale: Attendance dates should lie within the term.
  - id: EDU-007
    name: Attendance is not after term end
    type: compare
    fields: [attendance_date, term_end]
    params: {op: "<=", kind: datetime}
    severity: Medium
    explanation: The attendance date is after the term ended.
    recommendation: Check the class date.
    rationale: Attendance dates should lie within the term.
  - id: EDU-008
    name: Grade is in the institution's grade scale
    type: allowed_values
    fields: [grade]
    params: {values: [A+, A, A-, B+, B, B-, C+, C, C-, D, F, I, W, P, NP], case_sensitive: true}
    severity: Medium
    explanation: The grade is not in the configured scale.
    recommendation: Replace the list with your institution's scale, then review the value.
    rationale: Grade scales differ between institutions.
  - id: EDU-009
    name: Score is a number between 0 and 100
    type: range
    fields: [score]
    params: {min: 0, max: 100}
    category: Invalid
    severity: High
    explanation: The score is outside 0-100. Change the limits if your institution uses another scale.
    recommendation: Check the marks sheet.
    rationale: Configurable scale limits.
  - id: EDU-010
    name: Score values are numeric
    type: numeric
    fields: [score]
    severity: High
    explanation: The score is not a plain number.
    recommendation: Check for text such as 'absent'.
    rationale: Numeric checks need numbers.
  - id: EDU-011
    name: Attendance status is in the configured list
    type: allowed_values
    fields: [attendance_status]
    params: {values: [PRESENT, ABSENT, EXCUSED, LATE]}
    severity: Low
    explanation: The attendance status is not in the configured list.
    recommendation: Map to a known status.
    rationale: Status hygiene.
  - id: EDU-012
    name: Student ID format
    type: regex
    fields: [student_id]
    params: {pattern: '[A-Za-z0-9-]{4,20}', format_hint: "Example format; set to your institution's ID pattern."}
    severity: Low
    explanation: The student ID does not match the configured pattern.
    recommendation: Check for typos or stray characters.
    rationale: Format hygiene.
