profile_id: agriculture
name: Agriculture
version: "1.1.0"
owner: Nexora (educational prototype)
coverage: basic
description: >
  Field sensor and harvest checks: field/crop references, sensor intervals, unit consistency, moisture and yield plausibility.
guardrail: >
  Outliers may reflect real weather, pests or exceptional harvests. Review rather than remove. Basic coverage.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    duplicates: {key: [sensor_id, timestamp], rationale: "One reading per sensor and timestamp: an identical row is the same reading loaded twice."}
    units:
      - {label: yield, value_field: yield_value, unit_field: yield_unit, target_unit: t/ha,
         conversions: {t/ha: [1, 0], kg/ha: [0.001, 0], q/ha: [0.1, 0]},
         rationale: "Mass-per-area units convert exactly (1 kg/ha = 0.001 t/ha, 1 quintal/ha = 0.1 t/ha). Bushels are left unchanged because their weight depends on the crop."}
      - {label: soil moisture, value_field: soil_moisture, unit_field: moisture_unit, target_unit: "%",
         conversions: {"%": [1, 0], pct: [1, 0], percent: [1, 0], m3/m3: [100, 0]},
         rationale: "Volumetric water content as a fraction (m3/m3) is the percentage divided by 100."}
    outliers: {policy: review, rationale: "Sensor spikes are common in field equipment, but drought and flood readings are real; confirm before changing anything."}
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.1.0", date: "2026-10-28", note: "Added domain-aware cleaning settings (record key, spellings, units, outlier policy)."}
  - {version: "1.0.0", date: "2026-10-18", note: "Initial basic-coverage profile. Needs domain-expert validation."}
fields:
  field_id: {label: Field ID, type: identifier, required: true, aliases: [plot_id, parcel_id, fieldid]}
  crop: {label: Crop, type: category, aliases: [crop_type, crop_name]}
  sensor_id: {label: Sensor ID, type: identifier, required: true, aliases: [sensorid, probe_id, device_id]}
  timestamp: {label: Timestamp, type: datetime, required: true, aliases: [time, recorded_at, reading_time]}
  soil_moisture: {label: Soil moisture, type: number, aliases: [moisture, vwc]}
  moisture_unit: {label: Moisture unit, type: category, aliases: [moisture_uom]}
  temperature: {label: Temperature, type: number, aliases: [temp, soil_temperature]}
  yield_value: {label: Yield, type: number, aliases: [yield, harvest_yield]}
  yield_unit: {label: Yield unit, type: category, aliases: [yield_uom]}
  planting_date: {label: Planting date, type: datetime, aliases: [sowing_date, planted_on]}
  harvest_date: {label: Harvest date, type: datetime, aliases: [harvested_on]}
rules:
  - id: AGR-001
    name: Field, sensor and timestamp are present
    type: required
    fields: [field_id, sensor_id, timestamp]
    severity: High
    explanation: A mandatory field is empty.
    recommendation: Check the logger export.
    rationale: Traceability.
  - id: AGR-002
    name: Dates are valid
    type: datetime
    fields: [timestamp, planting_date, harvest_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: AGR-003
    name: Sensor and yield values are numeric
    type: numeric
    fields: [soil_moisture, temperature, yield_value]
    severity: High
    explanation: The value is not a plain number.
    recommendation: Check for error strings from the sensor.
    rationale: Numeric checks need numbers.
  - id: AGR-004
    name: One reading per sensor and time
    type: unique
    fields: [sensor_id, timestamp]
    severity: Medium
    explanation: More than one row exists for the same sensor and time.
    recommendation: Check for a duplicate upload.
    rationale: Duplicates skew averages.
  - id: AGR-005
    name: Gaps in sensor readings
    type: timestamp_gap
    fields: [timestamp]
    params: {group_by: [sensor_id], max_gap_seconds: 7200}
    severity: Medium
    explanation: Readings are further apart than the configured interval.
    recommendation: Check battery, connectivity or logger settings.
    rationale: Sensor interval continuity.
  - id: AGR-006
    name: Harvest is not before planting
    type: date_order
    fields: [planting_date, harvest_date]
    severity: High
    explanation: The harvest date is earlier than the planting date.
    recommendation: Check both dates.
    rationale: Season consistency.
  - id: AGR-007
    name: One yield unit per crop
    type: unit_consistency
    fields: [yield_unit]
    params: {group_by: [crop]}
    severity: High
    explanation: The same crop is reported in more than one yield unit.
    recommendation: Confirm units before comparing yields.
    rationale: Unit consistency.
  - id: AGR-008
    name: Percent soil moisture is between 0 and 100
    type: range
    fields: [soil_moisture]
    params: {min: 0, max: 100}
    when: [{field: moisture_unit, in: ["%"]}]
    category: Invalid
    severity: High
    explanation: A moisture percentage outside 0-100 is impossible.
    recommendation: Check the sensor calibration or the unit.
    rationale: Physical bound for percentages.
  - id: AGR-009
    name: Yield is not negative
    type: range
    fields: [yield_value]
    params: {min: 0}
    category: Invalid
    severity: High
    explanation: A negative yield is not possible.
    recommendation: Check the harvest record.
    rationale: Logical lower bound.
  - id: AGR-010
    name: Yield within configured plausible range
    type: range
    fields: [yield_value]
    params:
      unit_field: yield_unit
      ranges_by_unit:
        kg_per_ha: {min: 0, max: 20000}
        t_per_ha: {min: 0, max: 20}
    severity: Low
    explanation: The yield is outside the configured plausible range for its unit. Exceptional harvests exist.
    recommendation: Check the harvest weights and area.
    rationale: Example limits; set per crop and region.
  - id: AGR-011
    name: Crop is given when a yield is given
    type: required
    fields: [crop]
    when: [{field: yield_value, not_blank: true}]
    severity: Medium
    explanation: A yield was recorded without a crop.
    recommendation: Add the crop.
    rationale: Yield is only meaningful per crop.
  - id: AGR-012
    name: Sensor screening (statistical)
    type: statistical_anomaly
    fields: [soil_moisture, temperature]
    params: {method: iqr, k: 3.0, group_by: [sensor_id], min_samples: 10}
    severity: Low
    explanation: The value is far from the same sensor's other readings. Weather events can cause real extremes.
    recommendation: Review only.
    rationale: Screening aid.
