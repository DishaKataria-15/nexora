profile_id: construction
name: Construction and infrastructure
version: "1.1.0"
owner: Nexora (educational prototype)
coverage: basic
description: >
  Project and work-order checks: project/site references, work-order relationships, date sequence, inspection records, material units and quantity variation.
guardrail: >
  Approved design changes, substitutions and legitimate quantity variation are common. Variation flags are for review only. Basic coverage.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    duplicates: {key: [work_order_id], rationale: "A work order ID identifies one work order; an identical repeated row is a duplicate load."}
    normalize_case: {inspection_result: upper}
    outliers: {policy: review, rationale: "Quantities are not converted between units because quantity and planned quantity are compared in the unit of the material; large quantities can be real bulk orders."}
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.1.0", date: "2026-10-28", note: "Added domain-aware cleaning settings (record key, spellings, units, outlier policy)."}
  - {version: "1.0.0", date: "2026-10-18", note: "Initial basic-coverage profile. Needs domain-expert validation."}
fields:
  project_id: {label: Project ID, type: identifier, required: true, aliases: [projectid, project_code, project]}
  site_id: {label: Site ID, type: identifier, required: true, aliases: [siteid, site_code, site]}
  work_order_id: {label: Work order ID, type: identifier, required: true, aliases: [workorder_id, wo_id, wo_number]}
  parent_work_order_id: {label: Parent work order ID, type: identifier, aliases: [parent_wo, parent_work_order]}
  material: {label: Material, type: category, aliases: [material_name, material_type]}
  quantity: {label: Quantity used, type: number, aliases: [qty, actual_quantity]}
  planned_quantity: {label: Planned quantity, type: number, aliases: [planned_qty, budget_quantity]}
  unit: {label: Unit, type: category, aliases: [uom, units, quantity_unit]}
  start_date: {label: Start date, type: datetime, aliases: [started_on, work_start]}
  end_date: {label: End date, type: datetime, aliases: [completed_on, work_end]}
  inspection_date: {label: Inspection date, type: datetime, aliases: [inspected_on]}
  inspection_result: {label: Inspection result, type: category, aliases: [inspection_status, result]}
rules:
  - id: CON-001
    name: Project, site and work order are present
    type: required
    fields: [project_id, site_id, work_order_id]
    severity: High
    explanation: A mandatory reference is empty.
    recommendation: Obtain the reference from the project system.
    rationale: Traceability.
  - id: CON-002
    name: Work order IDs are unique
    type: unique
    fields: [work_order_id]
    severity: High
    explanation: The same work order ID appears more than once.
    recommendation: Check for duplicates.
    rationale: Record integrity.
  - id: CON-003
    name: Dates are valid
    type: datetime
    fields: [start_date, end_date, inspection_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: CON-004
    name: Work ends on or after it starts
    type: date_order
    fields: [start_date, end_date]
    severity: High
    explanation: The end date is earlier than the start date.
    recommendation: Check both dates.
    rationale: Date sequence.
  - id: CON-005
    name: Inspection is not before work starts
    type: compare
    fields: [inspection_date, start_date]
    params: {op: ">=", kind: datetime}
    severity: Medium
    explanation: The inspection date is before the work started. Pre-work inspections exist but need checking.
    recommendation: Confirm the inspection type.
    rationale: Date sequence.
  - id: CON-006
    name: Quantities are numeric
    type: numeric
    fields: [quantity, planned_quantity]
    severity: High
    explanation: The quantity is not a plain number.
    recommendation: Check for units attached to the value.
    rationale: Numeric checks need numbers.
  - id: CON-007
    name: Quantity is not negative
    type: range
    fields: [quantity]
    params: {min: 0}
    category: Invalid
    severity: High
    explanation: A negative quantity is not valid for material use.
    recommendation: Check whether it is a return to stock.
    rationale: Logical lower bound.
  - id: CON-008
    name: Material unit is expected and consistent per material
    type: unit_consistency
    fields: [unit]
    params: {expected_units: [m3, kg, t, m, m2, pcs, bag], group_by: [material]}
    severity: High
    explanation: The unit is unexpected or changes within a material.
    recommendation: Confirm the unit before summing quantities.
    rationale: Unit consistency.
  - id: CON-009
    name: Actual quantity close to plan (25% tolerance)
    type: expression_equals
    params: {target: quantity, expression: "planned_quantity", tolerance_abs: 0, tolerance_pct: 25}
    category: Suspicious
    severity: Low
    explanation: The quantity differs from the plan by more than the configured percentage. Approved design changes and substitutions explain many cases.
    recommendation: Check the change orders.
    rationale: Configurable quantity check.
  - id: CON-010
    name: Parent work order exists in this file
    type: referential
    fields: [parent_work_order_id]
    params: {reference_field: work_order_id}
    severity: Medium
    explanation: The parent work order is not in this file.
    recommendation: Check the work-order hierarchy.
    rationale: Work-order relationships.
  - id: CON-011
    name: Inspection result is in the configured list
    type: allowed_values
    fields: [inspection_result]
    params: {values: [PASS, FAIL, CONDITIONAL, PENDING]}
    severity: Medium
    explanation: The inspection result is not in the configured list.
    recommendation: Map to a known result.
    rationale: Inspection records.
  - id: CON-012
    name: Inspections have a result
    type: required
    fields: [inspection_result]
    when: [{field: inspection_date, not_blank: true}]
    severity: Medium
    explanation: An inspection date exists but the result is missing.
    recommendation: Add the inspection result.
    rationale: Inspection records.
