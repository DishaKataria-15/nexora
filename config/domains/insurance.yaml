profile_id: insurance
name: Insurance
version: "1.1.0"
owner: Nexora (educational prototype)
coverage: basic
description: >
  Policy and claim checks: references, date sequencing, coverage limits, required fields and duplicate-claim candidates.
guardrail: >
  Flags must never automatically deny a claim or label a customer as fraudulent. Basic coverage; needs expert validation.
settings:
  datetime_formats: ["ISO8601"]
  cleaning:
    duplicates: {key: [claim_id], rationale: "A claim ID identifies one claim; identical repeats are a duplicate extract."}
    normalize_case: {claim_status: upper}
    outliers: {policy: report_only, rationale: "Large claims are real catastrophic losses or potential fraud signals; capping them would hide exactly the cases that matter."}
scoring_weights: {completeness: 1, validity: 1, uniqueness: 1, consistency: 1, freshness: 1}
changelog:
  - {version: "1.1.0", date: "2026-10-28", note: "Added domain-aware cleaning settings (record key, spellings, units, outlier policy)."}
  - {version: "1.0.0", date: "2026-10-18", note: "Initial basic-coverage profile. Needs domain-expert validation."}
fields:
  policy_id: {label: Policy ID, type: identifier, required: true, aliases: [policy_number, policyid, policy_no]}
  claim_id: {label: Claim ID, type: identifier, required: true, aliases: [claim_number, claimid, claim_no]}
  customer_id: {label: Customer ID, type: identifier, aliases: [insured_id, holder_id]}
  policy_start: {label: Policy start, type: datetime, aliases: [inception_date, effective_date, start_date]}
  policy_end: {label: Policy end, type: datetime, aliases: [expiry_date, expiration_date, end_date]}
  loss_date: {label: Date of loss, type: datetime, required: true, aliases: [incident_date, date_of_loss]}
  claim_date: {label: Claim reported date, type: datetime, aliases: [reported_date, claim_reported_at]}
  claim_amount: {label: Claim amount, type: number, required: true, aliases: [claimed_amount, amount_claimed]}
  coverage_limit: {label: Coverage limit, type: number, aliases: [limit, sum_insured]}
  premium: {label: Premium, type: number, aliases: [premium_amount]}
  claim_status: {label: Claim status, type: category, aliases: [status]}
rules:
  - id: INS-001
    name: Claim references and loss date are present
    type: required
    fields: [policy_id, claim_id, loss_date, claim_amount]
    severity: High
    explanation: A mandatory claim field is empty.
    recommendation: Obtain the value from the claims system.
    rationale: Needed to process and audit a claim.
  - id: INS-002
    name: Claim IDs are unique
    type: unique
    fields: [claim_id]
    severity: High
    explanation: The same claim ID appears more than once.
    recommendation: Check for a double export.
    rationale: Duplicate IDs double count claims.
  - id: INS-003
    name: Dates are valid
    type: datetime
    fields: [policy_start, policy_end, loss_date, claim_date]
    severity: High
    explanation: The date is not valid ISO format.
    recommendation: Check the export format.
    rationale: Date checks depend on valid dates.
  - id: INS-004
    name: Policy ends after it starts
    type: date_order
    fields: [policy_start, policy_end]
    severity: High
    explanation: The policy end date is earlier than the start date.
    recommendation: Check the policy record.
    rationale: Policy period must be positive.
  - id: INS-005
    name: Loss occurred on or after policy start
    type: compare
    fields: [loss_date, policy_start]
    params: {op: ">=", kind: datetime}
    category: Suspicious
    severity: Medium
    explanation: The loss date is before the policy started. This needs review (back-dated cover or a typo) and is not proof of fraud.
    recommendation: Review the policy history with the underwriter.
    rationale: Date sequencing.
  - id: INS-006
    name: Loss occurred on or before policy end
    type: compare
    fields: [loss_date, policy_end]
    params: {op: "<=", kind: datetime}
    category: Suspicious
    severity: Medium
    explanation: The loss date is after the policy ended. Extended reporting periods can be legitimate.
    recommendation: Review the policy terms.
    rationale: Date sequencing.
  - id: INS-007
    name: Claim is reported on or after the loss
    type: date_order
    fields: [loss_date, claim_date]
    severity: Medium
    explanation: The claim was reported before the loss date.
    recommendation: Check both dates.
    rationale: A claim cannot precede the loss.
  - id: INS-008
    name: Claim amount within coverage limit
    type: compare
    fields: [claim_amount, coverage_limit]
    params: {op: "<=", kind: numeric}
    category: Suspicious
    severity: Medium
    explanation: The claimed amount exceeds the coverage limit. This is a review signal only and does not decide the claim.
    recommendation: Review with the claims handler.
    rationale: Premium/claim consistency.
  - id: INS-009
    name: Claim amount is numeric and not negative
    type: range
    fields: [claim_amount]
    params: {min: 0}
    category: Invalid
    severity: High
    explanation: The claim amount is negative.
    recommendation: Check whether it is a recovery or a sign error.
    rationale: Logical lower bound.
  - id: INS-010
    name: Possible duplicate claims (for review)
    type: duplicate_rows
    fields: [policy_id, loss_date, claim_amount]
    severity: Medium
    explanation: Several claims share policy, loss date and amount. Review before concluding anything.
    recommendation: A handler should review. This flag does not deny or reject any claim.
    rationale: Duplicate-claim candidates need human judgement.
  - id: INS-011
    name: Claim status is in the configured list
    type: allowed_values
    fields: [claim_status]
    params: {values: [OPEN, PENDING, APPROVED, DENIED, CLOSED, REOPENED]}
    severity: Medium
    explanation: The claim status is not in the configured list.
    recommendation: Map to a known status.
    rationale: Workflow status hygiene.
  - id: INS-012
    name: Policy exists in the policy register (needs reference file)
    type: referential
    fields: [policy_id]
    params: {reference_table: policies, reference_column: policy_id}
    severity: High
    explanation: The policy ID is not in the supplied policy register.
    recommendation: Check the policy number.
    rationale: Referential integrity. The rule is skipped unless a reference file called 'policies' is supplied.
  - id: INS-013
    name: Premium is numeric and not negative
    type: range
    fields: [premium]
    params: {min: 0}
    category: Invalid
    severity: Medium
    explanation: The premium is negative.
    recommendation: Check whether it is a refund line.
    rationale: Logical lower bound.
